[package]
name = "dotpilot"
version = "0.1.0"
description = "DotPilot - network, performance and profile control center"
edition = "2021"

[lib]
name = "dotpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
winping = "0.10"
reqwest = { version = "0.13", features = ["json", "blocking"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
